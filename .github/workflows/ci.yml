name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/studio
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ALLOWED_HOSTS: localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pip-audit
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Static files build
        run: python manage.py collectstatic --no-input
      - name: Deploy checks (production settings)
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests (on Postgres, production settings)
        env:
          SECURE_SSL_REDIRECT: "0"   # the test client speaks plain HTTP
        run: python manage.py test ops --verbosity 2
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
