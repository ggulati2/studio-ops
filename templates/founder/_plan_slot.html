<form method="post" class="plan-cell{% if slot == 2 %} plan-also{% endif %}">{% csrf_token %}<input type="hidden" name="user" value="{{ c.u.pk }}"><input type="hidden" name="date" value="{{ row.d|date:'Y-m-d' }}"><input type="hidden" name="slot" value="{{ slot }}">
  <select name="value" data-autosubmit aria-label="{% if slot == 2 %}Also{% else %}Plan{% endif %} for {{ c.u.profile.name }} on {{ row.d|date:'j M' }}">
    <option value="">{% if slot == 2 %}— remove —{% elif c.kind == 'half' %}HALF DAY{% elif c.kind == 'wfh' %}WFH{% else %}—{% endif %}</option>
    <optgroup label="Films in progress">{% for p in open_projects %}<option value="p:{{ p.pk }}" {% if e.project_id == p.pk and not e.is_revision %}selected{% endif %}>{{ p }}</option>{% endfor %}</optgroup>
    <optgroup label="Revisions on a delivered film">{% for p in delivered %}<option value="r:{{ p.pk }}" {% if e.is_revision and e.project_id == p.pk %}selected{% endif %}>Revisions: {{ p }}</option>{% endfor %}</optgroup>
    <optgroup label="Other">
      <option value="Back-up" {% if e.label == 'Back-up' %}selected{% endif %}>Back-up</option>
      <option value="SAME DAY" {% if e.label == 'SAME DAY' %}selected{% endif %}>Same day edit</option>
      <option value="Training" {% if e.label == 'Training' %}selected{% endif %}>Training</option>
    </optgroup>
  </select><noscript><button class="btn sm">Save</button></noscript>
  {% if e %}<details class="repeat"><summary title="Copy to the next days" aria-label="Copy {{ e.text }} to the next days">⤓</summary>
    <div class="repeat-pop">Copy to the next <input class="input" type="number" name="repeat" min="1" max="60" value="3" aria-label="Number of working days"> working days <button class="btn sm primary" name="repeat_go" value="1">Copy</button></div></details>{% endif %}
</form>
