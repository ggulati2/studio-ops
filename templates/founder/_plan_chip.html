{% load ops_extras %}<button type="button" class="chip{% if slot == 2 %} also{% endif %}{% if e.is_revision %} rev{% endif %}{% if not e.project_id %} lbl{% endif %}{% if e.project_id and not e.is_revision and e.project.editor_id != e.user_id and e.project.is_open and e.project.status != 'sent_agency' %} mismatch{% endif %}" data-chip data-slot="{{ slot }}" data-v="{{ e.value }}"{% if e.project_id %} style="--h:{{ e.project_id|hue }}"{% endif %} title="{% if slot == 2 %}Alongside: {% endif %}{{ e.text }}{% if e.project.deadline %} · due {{ e.project.deadline|date:'j M' }}{% endif %}{% if e.project_id and not e.is_revision and e.project.editor_id != e.user_id and e.project.is_open and e.project.status != 'sent_agency' %} · ⚠ editor on Projects: {% if e.project.editor_id %}{{ e.project.editor.profile.name }}{% else %}none{% endif %}{% endif %}">{% if slot == 2 %}<span class="plus" aria-hidden="true">+</span>{% endif %}{% if e.project_id %}{% if e.is_revision %}<span class="rv">Rev</span>{% endif %}<span class="ct">{{ e.project.couple }}</span><span class="cs">{{ e.project.deliverable }}{% if e.project.agency.code %} · {{ e.project.agency.code }}{% endif %}</span>{% else %}<span class="ct">{{ e.label }}</span>{% endif %}</button>
