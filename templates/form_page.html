{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="head"><div>{% if back %}<a href="{% url back %}" class="small">← Back</a>{% endif %}<h1>{{ title }}</h1>{% if intro %}<p>{{ intro }}</p>{% endif %}</div></div>
<form method="post" enctype="multipart/form-data" class="card" style="max-width:860px">
  {% csrf_token %}
  {% include "_form.html" %}
  <div class="actions"><button class="btn primary">{{ submit|default:"Save" }}</button>{% if back %}<a class="btn" href="{% url back %}">Cancel</a>{% endif %}</div>
</form>
{% endblock %}
