{% extends "base.html" %}{% load ops_extras %}
{% block title %}My payslips{% endblock %}
{% block content %}
<div class="head"><div><h1>My payslips</h1><p>Only you and the founders can see these.</p></div></div>
<section class="card">{% for s in slips %}<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line2);padding-top:8px"><span>{{ s.payroll.month|date:"F Y" }}</span><span><b>₹{{ s.net|money }}</b> · <a href="{% url 'payslip' s.pk %}" target="_blank">Open</a></span></div>{% empty %}<span class="muted">No payslips yet.</span>{% endfor %}</section>
{% endblock %}
