{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#E7E3DF;font-family:Jost,system-ui,sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding:12px;background:#111}
.bar button,.bar a{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:8px;border:0;background:#A90404;color:#fff;cursor:pointer;text-decoration:none}
.bar a{background:#333}
.page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
.pad{padding:16mm 16mm 12mm;display:flex;flex-direction:column;gap:14px;flex:1}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#5E5E5E;text-align:left;padding:7px 5px;border-bottom:1px solid #111}
td{padding:7px 5px;border-bottom:1px solid #F0EDEA;vertical-align:top}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#A90404}
.foot{display:flex;justify-content:space-between;font-size:10px;color:#5E5E5E;border-top:1px solid #E7E3DF;padding-top:8px;margin-top:auto}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}}
@media (max-width:820px){.page{width:100%;min-height:auto;margin:0}}
{% block style %}{% endblock %}
</style></head>
<body>
<div class="bar"><button onclick="window.print()">Download / Print PDF</button><a href="javascript:history.back()">Back</a></div>
{% block page %}{% endblock %}
</body></html>
