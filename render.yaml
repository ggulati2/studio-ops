# Render Blueprint: one free web service. The database lives on Neon (free, doesn't expire).
services:
  - type: web
    name: studio-ops
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FOUNDER_USERNAME
        sync: false
      - key: FOUNDER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost
      - key: TIME_ZONE
        value: Asia/Kolkata
